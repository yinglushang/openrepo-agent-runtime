<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenRepo Agent Runtime 界面预览</title>
  <desc id="desc">展示任务控制台、人工审批卡片和实时执行轨迹的深色仪表盘。</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55e6d3"/>
      <stop offset="1" stop-color="#65a7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="0%" r="80%">
      <stop offset="0" stop-color="#244b70" stop-opacity=".55"/>
      <stop offset="1" stop-color="#070b13" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;fill:#edf4ff}.muted{fill:#8290a7}.cyan{fill:#55e6d3}.mono{font-family:Consolas,monospace}.panel{fill:#0f1622;stroke:#283549;stroke-opacity:.72}.tiny{font-size:11px;font-weight:700;letter-spacing:2px}.label{font-size:13px}.heading{font-weight:800}.metric{font-size:26px;font-weight:700}.line{stroke:#2b3b52;stroke-width:1}.event{font-size:12px}.button{fill:#192334;stroke:#304057}.code{fill:#ffb8bf;font-size:12px}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#070b13"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <g opacity=".1" stroke="#9bb1cf">
    <path d="M0 80h1440M0 160h1440M0 240h1440M0 320h1440M0 400h1440M0 480h1440M0 560h1440M0 640h1440M0 720h1440M0 800h1440"/>
    <path d="M80 0v900M160 0v900M240 0v900M320 0v900M400 0v900M480 0v900M560 0v900M640 0v900M720 0v900M800 0v900M880 0v900M960 0v900M1040 0v900M1120 0v900M1200 0v900M1280 0v900M1360 0v900"/>
  </g>

  <g class="text">
    <rect x="54" y="35" width="46" height="46" rx="12" fill="url(#accent)"/>
    <text x="77" y="64" text-anchor="middle" fill="#071117" font-size="14" font-weight="900">OR</text>
    <text x="118" y="51" class="cyan tiny">LANGGRAPH · POLICY-FIRST</text>
    <text x="118" y="73" font-size="19" font-weight="750">OpenRepo Agent Runtime</text>
    <rect x="1230" y="43" width="155" height="34" rx="17" fill="#111a29" stroke="#2b3b52"/>
    <circle cx="1250" cy="60" r="5" fill="#55e6d3"/>
    <text x="1265" y="65" class="muted label">SSE 实时连接</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="54" y="108" width="1332" height="230" rx="18"/>
    <text x="88" y="143" class="cyan tiny">可恢复 · 可审批 · 可审计</text>
    <text x="88" y="188" class="text heading" font-size="35">让 Agent 的每一次行动</text>
    <text x="88" y="229" class="heading" font-size="35" fill="url(#accent)">都有边界，也有证据。</text>
    <text x="88" y="268" class="text muted" font-size="14">Python + LangGraph 驱动的安全运行时，高风险操作暂停等待人工审批。</text>
    <text x="88" y="293" class="text muted" font-size="14">全链路事件与 SHA-256 审计记录可回放、可验证。</text>
    <g transform="translate(820 141)">
      <rect width="245" height="72" rx="13" fill="#09111b" stroke="#263449"/><text x="18" y="33" class="cyan metric">0</text><text x="18" y="55" class="text muted label">工具调用</text>
      <rect x="260" width="245" height="72" rx="13" fill="#09111b" stroke="#263449"/><text x="278" y="33" class="cyan metric">1</text><text x="278" y="55" class="text muted label">风险拦截</text>
      <rect y="86" width="245" height="72" rx="13" fill="#09111b" stroke="#263449"/><text x="18" y="119" class="cyan metric">4</text><text x="18" y="141" class="text muted label">实时事件</text>
      <rect x="260" y="86" width="245" height="72" rx="13" fill="#09111b" stroke="#263449"/><text x="278" y="119" class="cyan metric">—</text><text x="278" y="141" class="text muted label">审计记录</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="54" y="360" width="825" height="472" rx="18"/>
    <text x="82" y="396" class="cyan tiny">AGENT CONSOLE</text>
    <text x="82" y="425" class="text heading" font-size="21">任务控制台</text>
    <rect x="671" y="386" width="180" height="28" rx="14" fill="#162131" stroke="#2a394f"/>
    <text x="687" y="405" class="text muted mono" font-size="10">fa7c37b7…e21a4dbb4530</text>
    <g transform="translate(82 445)" class="text label">
      <rect class="button" width="88" height="32" rx="8"/><text x="44" y="21" text-anchor="middle">列出文件</text>
      <rect class="button" x="98" width="88" height="32" rx="8"/><text x="142" y="21" text-anchor="middle">读取文件</text>
      <rect class="button" x="196" width="88" height="32" rx="8"/><text x="240" y="21" text-anchor="middle">写入审批</text>
      <rect class="button" x="294" width="88" height="32" rx="8"/><text x="338" y="21" text-anchor="middle" fill="#ff9ba5">危险操作</text>
    </g>
    <rect x="82" y="493" width="769" height="245" rx="13" fill="#080e17" stroke="#263449"/>
    <rect x="106" y="518" width="435" height="75" rx="11" fill="#182439"/>
    <text x="125" y="542" class="cyan tiny">RUNTIME</text>
    <text x="125" y="570" class="text" font-size="13">离线演示模式已准备好，选择任务或输入指令。</text>
    <rect x="578" y="615" width="245" height="58" rx="12" fill="url(#accent)"/>
    <text x="803" y="638" text-anchor="end" fill="#0b2226" class="tiny">YOU</text>
    <text x="803" y="658" text-anchor="end" fill="#071315" font-size="13">演示删除目录的危险操作</text>
    <rect x="82" y="758" width="592" height="49" rx="10" fill="#0b111c" stroke="#263449"/>
    <text x="100" y="788" class="text muted" font-size="13">例如：列出工作区中的文件</text>
    <rect x="686" y="758" width="165" height="49" rx="10" fill="url(#accent)"/>
    <text x="768" y="789" text-anchor="middle" fill="#061414" font-size="14" font-weight="800">运行任务 ↗</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="panel" x="897" y="360" width="489" height="270" rx="18"/>
    <text x="925" y="396" class="cyan tiny">HUMAN IN THE LOOP</text>
    <text x="925" y="425" class="text heading" font-size="20">人工审批</text>
    <rect x="1293" y="387" width="64" height="27" rx="14" fill="#351b27" stroke="#69303f"/><text x="1325" y="405" text-anchor="middle" fill="#ff7a86" font-size="11" font-weight="800">HIGH</text>
    <rect x="925" y="446" width="432" height="83" rx="10" fill="#201822" stroke="#63303c"/>
    <text x="943" y="468" fill="#ff7a86" class="tiny">TOOL REQUEST</text>
    <text x="943" y="492" class="text heading" font-size="15">run_command</text>
    <text x="943" y="515" class="code mono">{ "command": "rm -rf build" }</text>
    <text x="925" y="555" class="text muted" font-size="12">Command recursively or forcibly deletes files</text>
    <rect x="925" y="575" width="164" height="34" rx="8" fill="#192334" stroke="#304057"/><text x="1007" y="597" text-anchor="middle" class="text label">拒绝</text>
    <rect x="1099" y="575" width="258" height="34" rx="8" fill="url(#accent)"/><text x="1228" y="597" text-anchor="middle" fill="#061414" font-size="12" font-weight="800">批准执行</text>

    <rect class="panel" x="897" y="649" width="489" height="183" rx="18"/>
    <text x="925" y="685" class="cyan tiny">LIVE TELEMETRY</text>
    <text x="925" y="713" class="text heading" font-size="19">执行轨迹</text>
    <text x="1275" y="687" class="cyan" font-size="11">验证审计链</text>
    <path d="M936 735v74" class="line"/>
    <circle cx="936" cy="739" r="4" fill="#ff7a86"/><text x="953" y="743" class="text event">等待人工审批</text><text x="1270" y="743" class="muted mono event">#004</text>
    <circle cx="936" cy="772" r="4" fill="#65a7ff"/><text x="953" y="776" class="text event">模型推理</text><text x="1270" y="776" class="muted mono event">#003</text>
    <circle cx="936" cy="805" r="4" fill="#65a7ff"/><text x="953" y="809" class="text event">任务开始</text><text x="1270" y="809" class="muted mono event">#002</text>
  </g>

  <text x="720" y="875" text-anchor="middle" class="text muted tiny">PYTHON 3.12 · LANGGRAPH · FASTAPI · SQLITE · SSE · SHA-256 AUDIT CHAIN</text>
</svg>
