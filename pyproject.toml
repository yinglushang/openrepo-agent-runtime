[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrepo-agent-runtime"
version = "0.1.0"
description = "A LangGraph-based agent runtime with policy gates, durable sessions, SSE, and tamper-evident audit logs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.141.1",
  "langchain-core==1.6.3",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.7",
]

[project.scripts]
openrepo-runtime = "app.main:main"
openrepo-eval = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
